<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <title>Releases</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont; padding: 20px; }
    h1 { margin-bottom: 10px; }
    .repo { margin-bottom: 24px; }
    .tag { margin-left: 16px; }
    .time { color: #888; font-size: 12px; }
  </style>
</head>
<body>
<h1>📦 Mirror Releases</h1>
<div id="app">Loading...</div>

<script>
fetch('../releases.json')
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById('app');
    el.innerHTML = '';
    Object.keys(data).sort().forEach(repo => {
      const box = document.createElement('div');
      box.className = 'repo';
      box.innerHTML = `<h3>${repo}</h3>`;
      data[repo].forEach(r => {
        const div = document.createElement('div');
        div.className = 'tag';
        div.innerHTML = `🏷️ <a href="${r.url}" target="_blank">${r.tag}</a>
          <span class="time">${r.time}</span>`;
        box.appendChild(div);
      });
      el.appendChild(box);
    });
  });
</script>
</body>
</html>
