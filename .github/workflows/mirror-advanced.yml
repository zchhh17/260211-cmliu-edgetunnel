name: Mirror Advanced

on:
  workflow_dispatch:
  #schedule:
    #- cron: '0 */6 * * *'

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      UPSTREAM_REPO: cmliu/edgetunnel
      TARGET_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "mirror-bot"
          git config --global user.email "mirror@example.com"

      # 获取上游最新 SHA
      - name: Get upstream latest SHA
        id: upstream
        run: |
          UP_SHA=$(git ls-remote https://github.com/${UPSTREAM_REPO}.git refs/heads/main | cut -f1)
          echo "sha=$UP_SHA" >> $GITHUB_OUTPUT

      # 获取当前仓库 main SHA（如果存在）
      - name: Get current target SHA
        id: target
        run: |
          TARGET_SHA=$(git ls-remote https://github.com/${TARGET_REPO}.git refs/heads/main | cut -f1 || true)
          echo "sha=$TARGET_SHA" >> $GITHUB_OUTPUT

      # 判断是否有更新
      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.target.outputs.sha }}" ]; then
            echo "update=false" >> $GITHUB_OUTPUT
            echo "No update needed."
          else
            echo "update=true" >> $GITHUB_OUTPUT
            echo "Update detected."
          fi

      # 如果没更新就直接结束
      - name: Stop if no update
        if: steps.check.outputs.update == 'false'
        run: exit 0

      # 有更新才 clone
      - name: Clone upstream (mirror)
        run: |
          git clone --mirror https://github.com/${UPSTREAM_REPO}.git mirror.git
          cd mirror.git
          git remote remove origin
          git remote add origin https://x-access-token:${{ secrets.PAT }}@github.com/${TARGET_REPO}.git

      - name: Remove pull refs
        run: |
          cd mirror.git
          git for-each-ref --format='%(refname)' refs/pull | xargs -r -n 1 git update-ref -d

      - name: Push branches and tags
        run: |
          cd mirror.git
          git push origin --all --force
          git push origin --tags --force

      - name: Generate commit diff
        run: |
          cd mirror.git
          mkdir -p ../release-files
          echo "Mirror Time: $(date -u)" > ../release-files/summary.txt
          echo "Upstream: ${UPSTREAM_REPO}" >> ../release-files/summary.txt
          echo "Latest SHA: ${{ steps.upstream.outputs.sha }}" >> ../release-files/summary.txt
          echo "" >> ../release-files/summary.txt

          if [ -n "${{ steps.target.outputs.sha }}" ]; then
            git log ${{ steps.target.outputs.sha }}..${{ steps.upstream.outputs.sha }} --oneline > ../release-files/commit-diff.txt
          else
            echo "First run - full mirror" > ../release-files/commit-diff.txt
          fi

          # 防止空文件
          if [ ! -s ../release-files/commit-diff.txt ]; then
            echo "No visible commit differences (possibly fast-forward update)." > ../release-files/commit-diff.txt
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-${{ github.run_number }}
          name: Mirror Run ${{ github.run_number }}
          body_path: release-files/summary.txt
          files: |
            release-files/summary.txt
            release-files/commit-diff.txt
