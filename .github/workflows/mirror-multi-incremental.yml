name: Mirror Multi Incremental

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git gh

      - name: Run Incremental Mirror
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -Eeuo pipefail

          retry() {
            local n=1
            local max=3
            local delay=5
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++))
                  sleep $delay
                else
                  return 1
                fi
              }
            done
          }

          mkdir -p mirrors
          mkdir -p .mirror-state
          mkdir -p releases

          echo "# Mirror Index" > mirror-index.md
          echo "" >> mirror-index.md
          echo "Run time: $(date -u)" >> mirror-index.md
          echo "" >> mirror-index.md

          updated=0
          skipped=0
          failed=0

          while read repo; do
            [ -z "$repo" ] && continue

            safe_name=$(echo $repo | tr '/' '-')
            state_file=".mirror-state/${safe_name}.sha"

            upstream_sha=$(git ls-remote https://github.com/$repo.git HEAD | cut -f1 || echo "")

            if [ -z "$upstream_sha" ]; then
              failed=$((failed+1))
              continue
            fi

            last_sha=""
            if [ -f "$state_file" ]; then
              last_sha=$(cat "$state_file")
            fi

            if [ "$upstream_sha" = "$last_sha" ]; then
              echo "### $repo" >> mirror-index.md
              echo "- Upstream SHA: $upstream_sha" >> mirror-index.md
              echo "- Previous SHA: $last_sha" >> mirror-index.md
              echo "- Status: Skipped (No change)" >> mirror-index.md
              echo "" >> mirror-index.md
              skipped=$((skipped+1))
              continue
            fi

            dir="mirrors/$safe_name"
            rm -rf "$dir"

            retry git clone --bare https://github.com/$repo.git "$dir" || {
              failed=$((failed+1))
              continue
            }

            cd "$dir"

            git remote add target https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

            retry git push target 'refs/heads/*:refs/heads/*' || {
              cd -
              failed=$((failed+1))
              continue
            }

            retry git push target 'refs/tags/*:refs/tags/*' || {
              cd -
              failed=$((failed+1))
              continue
            }

            echo "$upstream_sha" > "../../$state_file"

            diff_file="../../releases/${safe_name}-commit.txt"
            echo "Recent Commits:" > "$diff_file"
            git log --oneline -n 20 >> "$diff_file"

            cd ../..

            tar --warning=no-file-changed --ignore-failed-read \
              -czf "releases/${safe_name}.tar.gz" "mirrors/${safe_name}"

            tag="mirror-$(date +%s)-$safe_name"

            gh release create "$tag" \
              "releases/${safe_name}.tar.gz" \
              "releases/${safe_name}-commit.txt" \
              --title "$repo mirror" \
              --notes "Upstream updated to $upstream_sha"

            echo "### $repo" >> mirror-index.md
            echo "- Upstream SHA: $upstream_sha" >> mirror-index.md
            echo "- Previous SHA: ${last_sha:-none}" >> mirror-index.md
            echo "- Status: Updated" >> mirror-index.md
            echo "" >> mirror-index.md

            updated=$((updated+1))

          done < mirror-list.txt

          echo "---" >> mirror-index.md
          echo "" >> mirror-index.md
          echo "Updated: $updated" >> mirror-index.md
          echo "Skipped: $skipped" >> mirror-index.md
          echo "Failed: $failed" >> mirror-index.md

          # =========================
          # Generate Advanced Dashboard
          # =========================

          echo "<!DOCTYPE html>" > dashboard.html
          echo "<html><head><meta charset='UTF-8'><title>Mirror Dashboard</title>" >> dashboard.html

          echo "<style>
          body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f8;padding:30px}
          .dark{background:#1e1e1e;color:#ddd}
          button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;background:#007bff;color:white}
          .dark button{background:#444}
          table{border-collapse:collapse;width:100%;margin-top:20px;background:white}
          .dark table{background:#2a2a2a}
          th,td{padding:10px;text-align:left}
          th{background:#111;color:white}
          tr:nth-child(even){background:#f2f2f2}
          .dark tr:nth-child(even){background:#333}
          .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
          .updated-dot{background:#28a745}
          .skipped-dot{background:#6c757d}
          .failed-dot{background:#dc3545}
          a{text-decoration:none;color:#007bff}
          .dark a{color:#4da3ff}
          </style></head><body>" >> dashboard.html

          echo "<h1>Mirror Dashboard</h1>" >> dashboard.html
          echo "<button onclick=\"document.body.classList.toggle('dark')\">Toggle Dark Mode</button>" >> dashboard.html
          echo "<p id='stats'></p>" >> dashboard.html

          echo "<table id='mirrorTable'>" >> dashboard.html
          echo "<tr><th>Repository</th><th>Upstream SHA</th><th>Previous SHA</th><th>Status</th></tr>" >> dashboard.html

          while read line; do
            if [[ $line == "### "* ]]; then
              repo_name=${line#"### "}
              read upstream_line
              read prev_line
              read status_line
              read blank

              upstream=${upstream_line#"- Upstream SHA: "}
              prev=${prev_line#"- Previous SHA: "}
              status=${status_line#"- Status: "}

              dot="skipped-dot"
              [[ $status == Updated* ]] && dot="updated-dot"
              [[ $status == Failed* ]] && dot="failed-dot"

              echo "<tr>" >> dashboard.html
              echo "<td><a href='https://github.com/$repo_name' target='_blank'>$repo_name</a></td>" >> dashboard.html
              echo "<td>${upstream:0:7}</td>" >> dashboard.html
              echo "<td>${prev:0:7}</td>" >> dashboard.html
              echo "<td><span class='status-dot $dot'></span>$status</td>" >> dashboard.html
              echo "</tr>" >> dashboard.html
            fi
          done < mirror-index.md

          echo "</table>" >> dashboard.html

          echo "<script>
          const rows=Array.from(document.querySelectorAll('#mirrorTable tr')).slice(1);
          rows.sort((a,b)=>b.cells[3].innerText.localeCompare(a.cells[3].innerText));
          rows.forEach(r=>document.querySelector('#mirrorTable').appendChild(r));
          document.getElementById('stats').innerText=
          'Last Run: $(date -u) | Updated: $updated | Skipped: $skipped | Failed: $failed';
          </script>" >> dashboard.html

          echo "</body></html>" >> dashboard.html

      - name: Commit state
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror@bot"
          git add .mirror-state mirror-index.md dashboard.html || true
          git commit -m "update mirror state & dashboard" || true
          git push
