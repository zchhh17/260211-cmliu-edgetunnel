name: Mirror Multi Incremental

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git gh

      - name: Run Incremental Mirror
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -Eeuo pipefail

          retry() {
            local n=1
            local max=3
            local delay=5
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  echo "Retry $n/$max..."
                  ((n++))
                  sleep $delay
                else
                  echo "Command failed after $max attempts."
                  return 1
                fi
              }
            done
          }

          mkdir -p mirrors
          mkdir -p .mirror-state
          mkdir -p releases

          echo "# Mirror Index" > mirror-index.md
          echo "" >> mirror-index.md
          echo "Run time: $(date -u)" >> mirror-index.md
          echo "" >> mirror-index.md

          updated=0
          skipped=0
          failed=0

          while read repo; do
            [ -z "$repo" ] && continue

            echo "==== Processing $repo ===="

            safe_name=$(echo $repo | tr '/' '-')
            state_file=".mirror-state/${safe_name}.sha"

            upstream_sha=$(git ls-remote https://github.com/$repo.git HEAD | cut -f1 || echo "")

            if [ -z "$upstream_sha" ]; then
              echo "❌ Failed to fetch upstream SHA"
              failed=$((failed+1))
              continue
            fi

            last_sha=""
            if [ -f "$state_file" ]; then
              last_sha=$(cat "$state_file")
            fi

            if [ "$upstream_sha" = "$last_sha" ]; then
             echo "⏭ No changes"
             echo "### $repo" >> mirror-index.md
             echo "- Upstream SHA: $upstream_sha" >> mirror-index.md
             echo "- Previous SHA: $last_sha" >> mirror-index.md
             echo "- Status: Skipped (No change)" >> mirror-index.md
             echo "" >> mirror-index.md
             skipped=$((skipped+1))
             continue
            fi

            dir="mirrors/$safe_name"
            rm -rf "$dir"

            retry git clone --bare https://github.com/$repo.git "$dir" || {
              echo "❌ Clone failed"
              failed=$((failed+1))
              continue
            }

            cd "$dir"

            git remote add target https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

            # 推 heads
            retry git push target 'refs/heads/*:refs/heads/*' || {
              echo "❌ Push heads failed"
              cd -
              failed=$((failed+1))
              continue
            }

            # 推 tags
            retry git push target 'refs/tags/*:refs/tags/*' || {
              echo "❌ Push tags failed"
              cd -
              failed=$((failed+1))
              continue
            }

            echo "$upstream_sha" > "../../$state_file"

            # 生成 commit diff
            diff_file="../../releases/${safe_name}-commit.txt"
            echo "🧾 Commit Diff" > "$diff_file"
            echo "" >> "$diff_file"
            git log --oneline -n 20 >> "$diff_file"

            cd ../..

            # 安全打包（在仓库外执行）
            tar --warning=no-file-changed --ignore-failed-read \
              -czf "releases/${safe_name}.tar.gz" "mirrors/${safe_name}"

            tag="mirror-$(date +%s)-$safe_name"

            gh release create "$tag" \
              "releases/${safe_name}.tar.gz" \
              "releases/${safe_name}-commit.txt" \
              --title "$repo mirror" \
              --notes "Upstream updated to $upstream_sha"

            echo "### $repo" >> mirror-index.md
            echo "- Upstream SHA: $upstream_sha" >> mirror-index.md
            echo "- Previous SHA: ${last_sha:-none}" >> mirror-index.md
            echo "- Status: Updated" >> mirror-index.md
            echo "" >> mirror-index.md

            updated=$((updated+1))

          done < mirror-list.txt

          echo "---" >> mirror-index.md
          echo "" >> mirror-index.md
          echo "Updated: $updated" >> mirror-index.md
          echo "Skipped: $skipped" >> mirror-index.md
          echo "Failed: $failed" >> mirror-index.md
          # 生成 HTML Dashboard
          echo "<!DOCTYPE html>" > dashboard.html
          echo "<html><head><meta charset='UTF-8'>" >> dashboard.html
          echo "<title>Mirror Dashboard</title>" >> dashboard.html
          echo "<style>
          body { font-family: Arial; background:#f5f5f5; padding:20px;}
          table { border-collapse: collapse; width:100%; background:white;}
          th, td { border:1px solid #ddd; padding:8px; }
          th { background:#222; color:white;}
          .updated { color:green; font-weight:bold;}
          .skipped { color:gray;}
          .failed { color:red; font-weight:bold;}
          </style>" >> dashboard.html
          echo "</head><body>" >> dashboard.html

          echo "<h1>Mirror Dashboard</h1>" >> dashboard.html
          echo "<p>Last Run: $(date -u)</p>" >> dashboard.html
          echo "<p>Updated: $updated | Skipped: $skipped | Failed: $failed</p>" >> dashboard.html

          echo "<table>" >> dashboard.html
          echo "<tr><th>Repository</th><th>Upstream SHA</th><th>Previous SHA</th><th>Status</th></tr>" >> dashboard.html

          while read line; do
             if [[ $line == "### "* ]]; then
              repo_name=${line#"### "}
              read upstream_line
              read prev_line
              read status_line
              read blank

              upstream=${upstream_line#"- Upstream SHA: "}
              prev=${prev_line#"- Previous SHA: "}
              status=${status_line#"- Status: "}

              class="skipped"
              [[ $status == Updated* ]] && class="updated"
              [[ $status == Failed* ]] && class="failed"

              echo "<tr>
              <td>$repo_name</td>
              <td>${upstream:-"-"}</td>
              <td>${prev:-"-"}</td>
              <td class='$class'>$status</td>
              </tr>" >> dashboard.html
             fi
          done < mirror-index.md

          echo "</table></body></html>" >> dashboard.html

      - name: Commit state
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror@bot"
          git add .mirror-state mirror-index.md dashboard.html || true
          git commit -m "update mirror state" || true
          git push
