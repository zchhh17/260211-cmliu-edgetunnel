name: Diff Test Safe

on:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra

      - name: Create test diff page
        run: |
          set -Eeuo pipefail
          mkdir -p public

          echo "<!doctype html>" > public/diff-test.html
          echo "<html><head><meta charset='utf-8'><title>Diff Test</title></head>" >> public/diff-test.html
          echo "<body style='background:#0b1220;color:#e5e7eb;font-family:monospace'>" >> public/diff-test.html
          echo "<h1>Diff Test OK</h1>" >> public/diff-test.html
          echo "<pre>" >> public/diff-test.html
          echo "+ added line" >> public/diff-test.html
          echo "- removed line" >> public/diff-test.html
          echo "  context line" >> public/diff-test.html
          echo "</pre></body></html>" >> public/diff-test.html

      - name: Commit page
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add public/diff-test.html
          git commit -m "test: add diff test page" || echo "No changes"
          git push
