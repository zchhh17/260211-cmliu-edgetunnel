name: Mirror Diff Pages

on:
  workflow_dispatch:
  #schedule:
    #- cron: "0 */6 * * *"

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra

      - name: Setup git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Generate diff pages (safe)
        run: |
          set -Eeuo pipefail

          out="diff-test.html"
          mkdir -p public

          cat > "$out" <<'EOF'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <title>Diff Test</title>
          <style>
          body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b1220;color:#e5e7eb;padding:16px}
          a{color:#60a5fa;text-decoration:none}
          pre{white-space:pre-wrap;line-height:1.45}
          </style>
          </head>
          <body>
          <h1>Diff Test Page</h1>
          <pre>
          + added line
          - removed line
            context line
          </pre>
          </body>
          </html>
          EOF
      

      - name: Commit diff pages
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add diff-*.html || true
          git commit -m "chore: update diff pages" || echo "No changes"
          git push
