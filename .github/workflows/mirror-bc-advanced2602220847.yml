name: Mirror BC Advanced (Portal + History + Trend + Diff)

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq

      - name: Run Mirror + Portal + Diff (Stable)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -Eeuo pipefail

          retry() {
            local n=1 max=3 delay=5
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  echo "Retry $n/$max..."
                  ((n++)); sleep $delay
                else
                  echo "Command failed after $max attempts."
                  return 1
                fi
              }
            done
          }

          mkdir -p mirrors work .mirror-state stats
          UPDATED=0
          SKIPPED=0
          FAILED=0
          CARDS=""
          HISTORY_ROWS=""

          while read repo; do
            [ -z "$repo" ] && continue

            safe_name=$(echo "$repo" | tr '/' '-')

            for branch in main beta2.0; do
              state_file=".mirror-state/${safe_name}.${branch}.sha"
              diff_file="diff-${safe_name}-${branch}.html"

              upstream_sha=$(git ls-remote https://github.com/$repo.git refs/heads/$branch | cut -f1 || true)
              [ -z "$upstream_sha" ] && continue

              last_sha=""
              [ -f "$state_file" ] && last_sha=$(cat "$state_file")

              status="Skipped (No change)"
              cls="skipped"

              rm -rf work/$safe_name
              retry git clone https://github.com/$repo.git work/$safe_name || { FAILED=$((FAILED+1)); continue; }

              cd work/$safe_name
              git fetch --all --tags

              if [ -n "$last_sha" ] && [ "$upstream_sha" != "$last_sha" ]; then
                git diff "$last_sha" "$upstream_sha" > diff.patch || true
              else
                echo "First sync or no previous SHA" > diff.patch
              fi
              cd -

              {
                echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Diff - $repo ($branch)</title></head>"
                echo "<body style='font-family:monospace;background:#0f1115;color:#e5e7eb;padding:20px'>"
                echo "<h1>$repo ($branch)</h1>"
                echo "<p>${last_sha:-first sync} → $upstream_sha</p><pre>"
                sed -e 's/^+/<span style="color:#22c55e">+/' \
                    -e 's/^-/<span style="color:#ef4444">-/' \
                    -e 's/^ /<span style="color:#9ca3af"> /' work/$safe_name/diff.patch
                echo "</pre></body></html>"
              } > "$diff_file"

              if [ "$upstream_sha" != "$last_sha" ]; then
                rm -rf mirrors/$safe_name
                retry git clone --bare https://github.com/$repo.git mirrors/$safe_name || { FAILED=$((FAILED+1)); continue; }

                cd mirrors/$safe_name
                git remote remove target 2>/dev/null || true
                git remote add target https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
                retry git push target "refs/heads/$branch:refs/heads/$branch"
                git show-ref --tags --quiet && retry git push target 'refs/tags/*:refs/tags/*' || echo "No tags"
                cd -

                echo "$upstream_sha" > "$state_file"
                UPDATED=$((UPDATED+1))
                status="Updated ($branch)"
                cls="updated"
              else
                SKIPPED=$((SKIPPED+1))
              fi

              CARDS="$CARDS
              <div class='card'>
                <div><b>$repo</b></div>
                <div>Branch: $branch</div>
                <div>Status: <span class='$cls'>$status</span></div>
                <a href='$diff_file'>View Diff</a>
              </div>"

              HISTORY_ROWS="$HISTORY_ROWS
              <tr><td>$repo</td><td>$branch</td><td>$upstream_sha</td><td>$status</td></tr>"

            done
          done < mirror-list.txt

          if [ ! -f stats/history.csv ]; then
            echo "time,updated,skipped,failed" > stats/history.csv
          fi
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),$UPDATED,$SKIPPED,$FAILED" >> stats/history.csv

          cat > dashboard.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mirror Dashboard</title></head>
          <body>
          <h1>Mirror Dashboard</h1>
          <div>'"$CARDS"'</div>
          </body></html>
          EOF

          cat > history.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>History</title></head>
          <body><table border="1">
          <tr><th>Repo</th><th>Branch</th><th>SHA</th><th>Status</th></tr>
          '"$HISTORY_ROWS"'
          </table></body></html>
          EOF

          cat > trend.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Trend</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
          <body><canvas id="c"></canvas>
          <script>
          fetch('stats/history.csv').then(r=>r.text()).then(t=>{
            const L=t.trim().split('\n').slice(1),lab=[],u=[],s=[],f=[];
            L.forEach(x=>{const a=x.split(',');lab.push(a[0]);u.push(+a[1]);s.push(+a[2]);f.push(+a[3]);});
            new Chart(document.getElementById('c'),{type:'line',data:{labels:lab,datasets:[
              {label:'Updated',data:u,borderColor:'green'},
              {label:'Skipped',data:s,borderColor:'gray'},
              {label:'Failed',data:f,borderColor:'red'}
            ]}});
          });
          </script></body></html>
          EOF

      - name: Commit Pages
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror@bot"
          git add dashboard.html history.html trend.html stats .mirror-state diff-*.html || true
          git commit -m "update mirror portal" || true
          git push origin infra
