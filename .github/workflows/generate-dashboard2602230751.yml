name: Generate Mirror Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - ".mirror-state/**"
      - "mirrors/**"
      - "history/**"

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate dashboard.html
        run: |
          set -Eeuo pipefail

          REPO_NAME="cmliu-edgetunnel"

          MAIN_DIFF="diff-${REPO_NAME}-main.html"
          BETA_DIFF="diff-${REPO_NAME}-beta2.0.html"

          cat > dashboard.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <title>Mirror Dashboard</title>
            <style>
              body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #0f172a;
                color: #e5e7eb;
                margin: 0;
                padding: 40px;
              }
              h1 {
                font-size: 28px;
                margin-bottom: 20px;
              }
              .card {
                background: #111827;
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 16px;
                box-shadow: 0 8px 20px rgba(0,0,0,.35);
              }
              .card h2 {
                margin: 0 0 10px;
                font-size: 20px;
              }
              .links a {
                display: inline-block;
                margin-right: 12px;
                color: #38bdf8;
                text-decoration: none;
                font-weight: 600;
              }
              .links a:hover {
                text-decoration: underline;
              }
              .meta {
                font-size: 13px;
                color: #94a3b8;
                margin-top: 6px;
              }
            </style>
          </head>
          <body>
            <h1>📊 Mirror Dashboard</h1>

            <div class="card">
              <h2>cmliu / edgetunnel</h2>
              <div class="links">
                <a href="./${MAIN_DIFF}" target="_blank">Main Diff</a>
                <a href="./${BETA_DIFF}" target="_blank">Beta2.0 Diff</a>
                <a href="./history.html" target="_blank">History</a>
                <a href="./trend.html" target="_blank">Trend</a>
              </div>
              <div class="meta">
                Last updated: $(date -u "+%Y-%m-%d %H:%M:%S UTC")
              </div>
            </div>

          </body>
          </html>
          EOF

      - name: Commit dashboard.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git commit -m "chore: update dashboard.html" || echo "No changes"

      - name: Push changes
        run: git push
