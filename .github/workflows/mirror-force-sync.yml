name: Mirror Force Sync (All Branches Safe)

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Force Sync Repos (All Branches)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -Eeuo pipefail

          while read repo; do
            [ -z "$repo" ] && continue
            echo "==== Processing $repo ===="

            rm -rf work
            git clone https://github.com/$repo.git work
            cd work

            git remote add target https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git fetch --all --tags

            # 强制同步所有分支（不影响 infra）
            git push target 'refs/heads/*:refs/heads/*' --force

            # 同步 tags（如果有）
            git push target --tags --force || echo "No tags to push"

            cd ..
            rm -rf work

          done < mirror-list.txt
