name: Mirror Dashboard (Auto Diff Links + Pretty)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra

      - name: Build Dashboard
        run: |
          set -Eeuo pipefail

          mkdir -p public

          # 自动扫描 Diff 页面
          DIFF_LINKS=""
          for f in public/diff-cmliu-edgetunnel-*.html; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/diff-cmliu-edgetunnel-//' | sed 's/.html//')
            DIFF_LINKS="$DIFF_LINKS <a class='btn' href='./$f' target='_blank'>$name Diff</a>"
          done

          cat > public/dashboard.html <<EOF
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <title>Mirror Dashboard</title>
          <style>
          body{font-family:ui-sans-serif,system-ui;background:#0b1220;color:#e5e7eb;padding:24px}
          h1{font-size:24px;margin-bottom:8px}
          .card{background:#111827;border-radius:16px;padding:16px;max-width:860px}
          .links{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
          .btn{background:#1f2933;padding:8px 14px;border-radius:10px;color:#93c5fd;text-decoration:none}
          .btn:hover{background:#243041}
          .footer{opacity:.7;margin-top:24px}
          </style>
          </head>
          <body>
            <h1>📊 Mirror Dashboard</h1>

            <div class="card">
              <h2>cmliu/edgetunnel</h2>

              <div class="links">
                $DIFF_LINKS
                <a class="btn" href="./history.html" target="_blank">History</a>
                <a class="btn" href="./trend.html" target="_blank">Trend</a>
                <a class="btn" href="./releases.html" target="_blank">Releases</a>
              </div>
            </div>

            <div class="footer">
              Auto generated by GitHub Actions · $(date -u +"%Y-%m-%d %H:%M UTC")
            </div>
          </body>
          </html>
          EOF

      - name: Commit Dashboard
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add public/dashboard.html
          git commit -m "chore: update dashboard (auto diff links)" || echo "No changes"
          git push
