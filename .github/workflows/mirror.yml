name: Mirror Sync

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra branch
        uses: actions/checkout@v4
        with:
          ref: infra

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run Mirror Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p mirrors
          mkdir -p history
          mkdir -p releases

          UPDATED=0
          SKIPPED=0
          FAILED=0
          TABLE_ROWS=""

          while IFS= read -r repo || [ -n "$repo" ]; do
            [ -z "$repo" ] && continue

            echo "==== Processing $repo ===="

            NAME=$(echo "$repo" | tr '/' '-')
            TARGET_REPO="https://github.com/${{ github.repository_owner }}/260211-$NAME.git"

            UPSTREAM_HEAD=$(git ls-remote https://github.com/$repo.git HEAD | awk '{print $1}')

            if [ -f mirrors/$NAME.sha ]; then
              PREV_HEAD=$(cat mirrors/$NAME.sha)
            else
              PREV_HEAD="none"
            fi

            if [ "$UPSTREAM_HEAD" = "$PREV_HEAD" ]; then
              STATUS="Skipped"
              CLASS="skipped"
              SKIPPED=$((SKIPPED+1))
            else
              git clone --mirror https://github.com/$repo.git mirrors/$NAME
              cd mirrors/$NAME
              git push --mirror https://github.com/${{ github.repository }}.git || true
              cd ../..

              echo "$UPSTREAM_HEAD" > mirrors/$NAME.sha
              STATUS="Updated"
              CLASS="updated"
              UPDATED=$((UPDATED+1))
            fi

            RELEASE_JSON=$(curl -s https://api.github.com/repos/$repo/releases/latest)
            TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // "none"')
            RELEASE_DATE=$(echo "$RELEASE_JSON" | jq -r '.published_at // "none"')
            ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[0].browser_download_url // empty')

            if [ -n "$ASSET_URL" ]; then
              mkdir -p releases/$NAME/$TAG
              curl -L -o releases/$NAME/$TAG/asset.zip "$ASSET_URL"
            fi

            echo "<p>$repo | $UPSTREAM_HEAD | $TAG | $(date)</p>" >> history/$NAME.html

            TABLE_ROWS="$TABLE_ROWS
            <tr>
              <td>$repo</td>
              <td>$TAG</td>
              <td>${RELEASE_DATE:0:10}</td>
              <td>$UPSTREAM_HEAD</td>
              <td>$PREV_HEAD</td>
              <td class='$CLASS'>$STATUS</td>
            </tr>"

          done < mirror-list.txt

          cat > dashboard.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset='UTF-8'>
          <meta http-equiv='refresh' content='120'>
          <title>Mirror Dashboard</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <style>
          :root {
            --bg: #f5f5f5;
            --fg: #111;
            --card: #fff;
            --th: #222;
            --border: #ddd;
          }
          [data-theme="dark"] {
            --bg: #0f1115;
            --fg: #e6e6e6;
            --card: #151923;
            --th: #1f2937;
            --border: #2b2f3a;
          }
          body { font-family: Arial; background:var(--bg); color:var(--fg); padding:20px; transition:.2s;}
          table { border-collapse: collapse; width:100%; background:var(--card);}
          th, td { border:1px solid var(--border); padding:8px; }
          th { background:var(--th); color:white;}
          .updated { color:#22c55e; font-weight:bold;}
          .skipped { color:#9ca3af;}
          .failed { color:#ef4444; font-weight:bold;}
          input { padding:6px; width:260px; margin-bottom:10px; }
          button { padding:6px 10px; cursor:pointer; }
          .topbar { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
          </style>
          </head>
          <body>

          <h1>Mirror Dashboard</h1>
          <p>Last Run: $(date)</p>
          <p>Updated: $UPDATED | Skipped: $SKIPPED | Failed: $FAILED</p>

          <div class="topbar">
            <input type="text" id="searchBox" placeholder="Search repository...">
            <button id="themeToggle">🌙 Dark Mode</button>
          </div>

          <table id="mirrorTable">
          <thead>
          <tr>
          <th>Repository</th>
          <th>Latest Tag</th>
          <th>Published</th>
          <th>Upstream SHA</th>
          <th>Previous SHA</th>
          <th>Status</th>
          </tr>
          </thead>
          <tbody>
          $TABLE_ROWS
          </tbody>
          </table>

          <canvas id="chart" width="400" height="120"></canvas>

          <script>
          new Chart(document.getElementById('chart'), {
            type: 'bar',
            data: {
              labels: ['Updated','Skipped','Failed'],
              datasets: [{
                label: 'Last Run',
                data: [$UPDATED,$SKIPPED,$FAILED]
              }]
            }
          });

          // 🔎 搜索
          document.getElementById('searchBox').addEventListener('keyup', function() {
            const filter = this.value.toLowerCase();
          document.querySelectorAll('#mirrorTable tbody tr').forEach(row => {
              row.style.display = row.innerText.toLowerCase().includes(filter) ? '' : 'none';
            });
          });

          // 🌗 暗黑模式
          const root = document.documentElement;
          const btn = document.getElementById('themeToggle');
          const saved = localStorage.getItem('theme');

          if (saved === 'dark') {
            root.setAttribute('data-theme','dark');
            btn.textContent = '☀️ Light Mode';
          }

          btn.onclick = () => {
            const dark = root.getAttribute('data-theme') === 'dark';
            if (dark) {
              root.removeAttribute('data-theme');
              localStorage.setItem('theme','light');
              btn.textContent = '🌙 Dark Mode';
            } else {
              root.setAttribute('data-theme','dark');
              localStorage.setItem('theme','dark');
              btn.textContent = '☀️ Light Mode';
            }
          };

          // 📊 状态排序：Updated > Skipped > Failed
          const priority = { 'updated': 1, 'skipped': 2, 'failed': 3 };
          const tbody = document.querySelector('#mirrorTable tbody');
          const rows = Array.from(tbody.querySelectorAll('tr'));

          rows.sort((a, b) => {
            const sa = a.querySelector('td:last-child').className;
            const sb = b.querySelector('td:last-child').className;
            if (priority[sa] !== priority[sb]) {
              return priority[sa] - priority[sb];
            }
            return a.children[0].innerText.localeCompare(b.children[0].innerText);
          });

          rows.forEach(r => tbody.appendChild(r));
          </script>

          </body>
          </html>
          EOF

      - name: Commit Dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Mirror update" || echo "No changes"
          git push origin infra
