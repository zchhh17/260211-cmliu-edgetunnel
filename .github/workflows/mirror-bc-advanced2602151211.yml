name: Mirror BC Advanced (Portal + History + Trend + Diff)

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq

      - name: Run Mirror + Portal + Diff
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -Eeuo pipefail

          retry() {
            local n=1 max=3 delay=5
            while true; do
              "$@" && break || {
                if [[ $n -lt $max ]]; then
                  ((n++)); sleep $delay
                else
                  return 1
                fi
              }
            done
          }

          mkdir -p mirrors .mirror-state stats
          UPDATED=0
          SKIPPED=0
          FAILED=0
          CARDS=""
          HISTORY_ROWS=""

          while read repo; do
            [ -z "$repo" ] && continue
            safe_name=$(echo "$repo" | tr '/' '-')
            state_file=".mirror-state/${safe_name}.sha"

            main_sha=$(git ls-remote https://github.com/$repo.git refs/heads/main | cut -f1 || true)
            beta_sha=$(git ls-remote https://github.com/$repo.git refs/heads/beta2.0 | cut -f1 || true)
            upstream_sha="${main_sha:-$beta_sha}"

            last_sha=""
            [ -f "$state_file" ] && last_sha=$(cat "$state_file")

            status="Skipped (No change)"
            cls="skipped"

            if [ -n "$upstream_sha" ] && [ "$upstream_sha" != "$last_sha" ]; then
              rm -rf mirrors/$safe_name
              retry git clone --bare https://github.com/$repo.git mirrors/$safe_name || { FAILED=$((FAILED+1)); continue; }

              cd mirrors/$safe_name
              git fetch --all --tags || true
              git remote add target https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
              git push target 'refs/heads/*:refs/heads/*' || true
              git push target 'refs/tags/*:refs/tags/*' || true

              if [ -n "$last_sha" ] && git cat-file -e "$last_sha" 2>/dev/null && git cat-file -e "$upstream_sha" 2>/dev/null; then
                git diff "$last_sha" "$upstream_sha" > ../../diff.patch || true
              fi
              cd -

              if [ -f diff.patch ]; then
                {
                  echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Diff - $repo</title></head>"
                  echo "<body style='font-family:monospace;background:#0f1115;color:#e5e7eb;padding:20px'>"
                  echo "<h1>Diff: $repo</h1><p>$last_sha → $upstream_sha</p><pre>"
                  sed -e 's/^+/<span style="color:#22c55e">+/' \
                      -e 's/^-/<span style="color:#ef4444">-/' \
                      -e 's/^ /<span style="color:#9ca3af"> /' diff.patch
                  echo "</pre></body></html>"
                } > diff-$safe_name.html
                rm -f diff.patch
              fi

              echo "$upstream_sha" > "$state_file"
              UPDATED=$((UPDATED+1))
              status="Updated"
              cls="updated"
            else
              SKIPPED=$((SKIPPED+1))
            fi

            CARDS="$CARDS
            <div class='card'>
              <div class='repo'>$repo</div>
              <div class='meta'>Upstream: $upstream_sha</div>
              <div class='meta'>Previous: ${last_sha:-none}</div>
              <span class='badge $cls'>$status</span>
              <div class='meta'><a href='diff-$safe_name.html'>View Diff</a></div>
            </div>"

            HISTORY_ROWS="$HISTORY_ROWS
            <tr><td>$repo</td><td>$upstream_sha</td><td>$status</td></tr>"

          done < mirror-list.txt

          [ ! -f stats/history.csv ] && echo "time,updated,skipped,failed" > stats/history.csv
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),$UPDATED,$SKIPPED,$FAILED" >> stats/history.csv

          cat > dashboard.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Mirror Dashboard</title></head>
          <body>
          <h1>Mirror Dashboard</h1>
          <p>Updated: $UPDATED | Skipped: $SKIPPED | Failed: $FAILED</p>
          <div>$CARDS</div>
          </body></html>
          EOF

          cat > history.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Mirror History</title></head>
          <body><table border="1"><tr><th>Repo</th><th>SHA</th><th>Status</th></tr>
          $HISTORY_ROWS
          </table></body></html>
          EOF

          cat > trend.html <<EOF
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8"><title>Trend</title></head>
          <body><pre>Trend page placeholder</pre></body></html>
          EOF

      - name: Commit Pages
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror@bot"
          git add dashboard.html history.html trend.html stats diff-*.html .mirror-state || true
          git commit -m "update mirror portal" || true
          git push origin infra
