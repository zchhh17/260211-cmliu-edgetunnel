name: Mirror Portal (A)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4

      - name: Prepare data
        run: |
          mkdir -p public
          echo "[]" > public/data.json

      - name: Generate portal html
        run: |
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>GitHub Mirror Portal</title>
            <style>
              body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background:#0f172a; color:#e5e7eb; padding:20px; }
              input { width:100%; padding:10px; border-radius:6px; border:none; outline:none; }
              .card { background:#020617; padding:12px; border-radius:10px; margin-top:12px; }
              .ok { border-left:6px solid #22c55e; }
              .fail { border-left:6px solid #ef4444; }
              .name { font-size:18px; font-weight:600; }
              .log { font-size:12px; color:#94a3b8; margin-top:4px; white-space:pre-wrap; }
            </style>
          </head>
          <body>
            <h1>📦 GitHub 备份镜像状态面板</h1>
            <input id="search" placeholder="输入仓库名自动过滤..." />

            <div id="list"></div>

            <script>
              const list = document.getElementById('list');
              const search = document.getElementById('search');

              async function load() {
                const res = await fetch('./data.json');
                const data = await res.json();
                render(data);
                search.oninput = () => {
                  const kw = search.value.toLowerCase();
                  render(data.filter(i => i.name.toLowerCase().includes(kw)));
                };
              }

              function render(items) {
                list.innerHTML = items.map(i => `
                  <div class="card ${i.ok ? 'ok' : 'fail'}">
                    <div class="name">${i.name}</div>
                    <div>最新提交: ${i.commit || '-'}</div>
                    <div class="log">${i.log || ''}</div>
                  </div>
                `).join('');
              }

              load();
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
