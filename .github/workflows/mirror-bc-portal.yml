name: Mirror Bc Portal

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra branch
        uses: actions/checkout@v4
        with:
          ref: infra

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run Mirror Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p mirrors
          mkdir -p history
          mkdir -p releases

          # 统计计数
          UPDATED=0
          SKIPPED=0
          FAILED=0

          CARDS=""

          while read repo; do
            [ -z "$repo" ] && continue

            safe_name=$(echo "$repo" | tr '/' '-')
            state_file=".mirror-state/${safe_name}.sha"

            upstream_sha=$(git ls-remote https://github.com/$repo.git HEAD | cut -f1 || echo "")
            last_sha=""
            [ -f "$state_file" ] && last_sha=$(cat "$state_file")

            status="Skipped"
            badge_class="skipped"

            if [ -z "$upstream_sha" ]; then
              status="Failed"
              badge_class="failed"
              FAILED=$((FAILED+1))
            elif [ "$upstream_sha" != "$last_sha" ]; then
              status="Updated"
              badge_class="updated"
              UPDATED=$((UPDATED+1))
            else
              SKIPPED=$((SKIPPED+1))
            fi

            CARDS="$CARDS
            <div class='card'>
              <div class='repo'>$repo</div>
              <div class='meta'>Last check: $(date -u)</div>
              <span class='badge $badge_class'>$status</span>
              <hr>
              <div class='row'><span>Upstream SHA</span><span>${upstream_sha:-N/A}</span></div>
              <div class='row'><span>Previous SHA</span><span>${last_sha:-N/A}</span></div>
            </div>
            "
          done < mirror-list.txt
          
          cat > dashboard.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset='UTF-8'>
          <meta http-equiv='refresh' content='120'>
          <title>Mirror Dashboard</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <style>
          :root {
            --bg:#f5f5f5; --fg:#111; --card:#fff; --border:#e5e7eb;
            --ok:#22c55e; --skip:#9ca3af; --fail:#ef4444; --muted:#6b7280;
          }
          [data-theme="dark"] {
            --bg:#0f1115; --fg:#e5e7eb; --card:#151923; --border:#2b2f3a;
          }
          *{box-sizing:border-box}
          body{font-family:Arial;background:var(--bg);color:var(--fg);padding:20px;transition:.2s}
          h1{margin-bottom:6px}
          .topbar{display:flex;gap:10px;align-items:center;margin:10px 0 14px}
          input{padding:8px 10px;width:280px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--fg)}
          button{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
          .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 6px 16px rgba(0,0,0,.05)}
          .repo{font-weight:bold;font-size:16px;word-break:break-all}
          .meta{color:var(--muted);font-size:12px;margin:6px 0}
          .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;color:white}
          .updated{background:var(--ok)}
          .skipped{background:var(--skip)}
          .failed{background:var(--fail)}
          .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:6px 0}
          hr{border:none;border-top:1px dashed var(--border);margin:8px 0}
          </style>
          </head>
          <body>

          <h1>Mirror Dashboard</h1>
          <p>Last Run: $(date -u)</p>
          <p>Updated: $UPDATED | Skipped: $SKIPPED | Failed: $FAILED</p>

          <div class="topbar">
            <input id="searchBox" placeholder="Search repository...">
            <button id="themeToggle">🌙 Dark Mode</button>
          </div>

          <div id="grid" class="grid">
          $CARDS
          </div>

          <canvas id="chart" width="400" height="120" style="margin-top:16px"></canvas>

          <script>
          new Chart(document.getElementById('chart'), {
            type: 'bar',
            data: { labels:['Updated','Skipped','Failed'],
              datasets:[{label:'Last Run',data:[$UPDATED,$SKIPPED,$FAILED]}]
            }
          });

          document.getElementById('searchBox').addEventListener('input', e => {
            const v = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c=>{
              c.style.display = c.innerText.toLowerCase().includes(v) ? '' : 'none';
            });
          });

          const root=document.documentElement,btn=document.getElementById('themeToggle');
          if(localStorage.getItem('theme')==='dark'){root.setAttribute('data-theme','dark');btn.textContent='☀️ Light Mode'}
          btn.onclick=()=>{const d=root.getAttribute('data-theme')==='dark';
            if(d){root.removeAttribute('data-theme');localStorage.setItem('theme','light');btn.textContent='🌙 Dark Mode'}
            else{root.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');btn.textContent='☀️ Light Mode'}
          };
          </script>

          </body>
          </html>
          EOF

          mkdir -p stats
          if [ ! -f stats/history.csv ]; then
            echo "time,updated,skipped,failed" > stats/history.csv
          fi

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ),$UPDATED,$SKIPPED,$FAILED" >> stats/history.csv

          cat > trend.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset='UTF-8'>
          <title>Mirror Trends</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <style>
          body { font-family: Arial; background:#f5f5f5; padding:20px;}
          canvas { background:white; border-radius:12px; padding:12px;}
          </style>
          </head>
          <body>

          <h1>Mirror Update Trends</h1>
          <p>Auto-generated</p>

          <canvas id="trendChart" width="400" height="160"></canvas>

          <script>
          fetch('stats/history.csv')
            .then(r => r.text())
            .then(t => {
              const lines = t.trim().split('\n').slice(1);
              const labels = [], updated = [], skipped = [], failed = [];
              lines.forEach(l => {
                const [time,u,s,f] = l.split(',');
                labels.push(time.replace('T',' ').replace('Z',''));
                updated.push(Number(u));
                skipped.push(Number(s));
                failed.push(Number(f));
              });

              new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: {
                  labels: labels,
                  datasets: [
                    { label: 'Updated', data: updated, borderColor: 'green', tension: 0.3 },
                    { label: 'Skipped', data: skipped, borderColor: 'gray', tension: 0.3 },
                    { label: 'Failed', data: failed, borderColor: 'red', tension: 0.3 }
                  ]
                }
              });
            });
          </script>

          </body>
          </html>
          EOF
          
          HISTORY_ROWS=""
          gh api repos/${{ github.repository }}/releases --paginate > releases.json

          while read repo; do
            [ -z "$repo" ] && continue

            for tag in $(jq -r '.[].tag_name' releases.json | head -n 5); do
              HISTORY_ROWS="$HISTORY_ROWS
              <tr>
                <td>$repo</td>
                <td>$tag</td>
                <td><a href='https://github.com/${{ github.repository }}/releases/tag/$tag' target='_blank'>View Release</a></td>
              </tr>"
            done
          done < mirror-list.txt
          
          cat > history.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset='UTF-8'>
          <title>Mirror History</title>
          <style>
          body { font-family: Arial; background:#f5f5f5; padding:20px;}
          table { border-collapse: collapse; width:100%; background:white;}
          th, td { border:1px solid #ddd; padding:8px; font-size:14px; }
          th { background:#222; color:white;}
          a { color:#2563eb; text-decoration:none; }
          </style>
          </head>
          <body>
          <h1>Mirror History</h1>
          <p>Generated at: $(date -u)</p>
          <table>
          <tr>
            <th>Repository</th>
            <th>Tag</th>
            <th>Release</th>
          </tr>
          $HISTORY_ROWS
          </table>
          </body>
          </html>
          EOF
          
      - name: Commit Dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git add stats trend.html dashboard.html history.html mirror-index.md || true
          git commit -m "Mirror update" || echo "No changes"
          git push origin infra
