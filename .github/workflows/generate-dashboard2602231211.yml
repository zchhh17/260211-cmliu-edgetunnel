name: Generate Mirror Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - ".mirror-state/**"
      - "mirrors/**"
      - "history/**"

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate dashboard.html
        run: |
          set -Eeuo pipefail

          REPO_NAME="cmliu-edgetunnel"
          STATE_FILE=".mirror-state/cmliu-edgetunnel.json"

          MAIN_DIFF="diff-${REPO_NAME}-main.html"
          BETA_DIFF="diff-${REPO_NAME}-beta2.0.html"

          if [ -f "$STATE_FILE" ]; then
            STATUS=$(jq -r .status "$STATE_FILE")
            TIME=$(jq -r .time "$STATE_FILE")
            COMMIT=$(jq -r .commit "$STATE_FILE")
          else
            STATUS="unknown"
            TIME="never"
            COMMIT="none"
          fi

          if [ "$STATUS" = "success" ]; then
            BADGE='<span class="badge ok">SUCCESS</span>'
          elif [ "$STATUS" = "failed" ]; then
            BADGE='<span class="badge fail">FAILED</span>'
          else
            BADGE='<span class="badge unknown">UNKNOWN</span>'
          fi

          cat > dashboard.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <title>Mirror Dashboard</title>
            <style>
              body { font-family: system-ui; background:#0f172a; color:#e5e7eb; padding:40px }
              .card { background:#111827; border-radius:12px; padding:20px; margin-bottom:16px }
              .links a { margin-right:12px; color:#38bdf8; font-weight:600; text-decoration:none }
              .badge { padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700 }
              .ok { background:#16a34a }
              .fail { background:#dc2626 }
              .unknown { background:#475569 }
              .meta { font-size:13px; color:#94a3b8; margin-top:6px }
            </style>
          </head>
          <body>
            <h1>📊 Mirror Dashboard</h1>

            <div class="card">
              <h2>cmliu / edgetunnel ${BADGE}</h2>
              <div class="links">
                <a href="./${MAIN_DIFF}" target="_blank">Main Diff</a>
                <a href="./${BETA_DIFF}" target="_blank">Beta2.0 Diff</a>
                <a href="./history.html" target="_blank">History</a>
                <a href="./trend.html" target="_blank">Trend</a>
              </div>
              <div class="meta">
                🕒 Last sync: ${TIME}<br>
                🧾 Last commit: ${COMMIT}
              </div>
            </div>

          </body>
          </html>
          EOF

      - name: Commit dashboard.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git commit -m "chore: update dashboard.html" || echo "No changes"

      - name: Push changes
        run: git push
