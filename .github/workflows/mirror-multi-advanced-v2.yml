name: Mirror Multi Advanced v2

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Run Mirror
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -Eeuo pipefail

          mkdir -p mirrors
          echo "# Mirror Index" > mirror-index.md
          echo "" >> mirror-index.md
          echo "Run time: $(date -u)" >> mirror-index.md
          echo "" >> mirror-index.md

          updated=0
          skipped=0
          failed=0

          while read repo; do
            [ -z "$repo" ] && continue
            echo "==== Processing $repo ===="

            dir="mirrors/$(echo $repo | tr '/' '-')"
            rm -rf "$dir"

            upstream_sha=$(git ls-remote https://github.com/$repo.git HEAD | cut -f1 || echo "fail")

            if [ "$upstream_sha" = "fail" ] || [ -z "$upstream_sha" ]; then
              echo "❌ Failed to fetch upstream SHA"
              failed=$((failed+1))
              continue
            fi

            git clone --mirror https://github.com/$repo.git "$dir" || {
              echo "❌ Clone failed"
              failed=$((failed+1))
              continue
            }

            cd "$dir"

            mirror_sha=$(git rev-parse HEAD || echo "none")

            if [ "$upstream_sha" = "$mirror_sha" ]; then
              echo "⏭ No changes"
              skipped=$((skipped+1))
              cd -
              continue
            fi

            git remote add target https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git push target --mirror || {
              echo "❌ Push failed"
              failed=$((failed+1))
              cd -
              continue
            }

            echo "🧾 Commit Diff" > commit-diff.txt
            echo "" >> commit-diff.txt
            git log --oneline -n 20 >> commit-diff.txt

            tar -czf repo.tar.gz .

            if [ ! -s repo.tar.gz ]; then
              echo "⚠ Empty archive, skipping release"
              cd -
              continue
            fi

            tag="mirror-$(date +%s)"

            gh release create "$tag" \
              repo.tar.gz \
              commit-diff.txt \
              --title "$repo mirror" \
              --notes "Upstream: $upstream_sha"

            echo "### $repo" >> ../../mirror-index.md
            echo "- Upstream SHA: $upstream_sha" >> ../../mirror-index.md
            echo "- Mirror SHA: $mirror_sha" >> ../../mirror-index.md
            echo "- Status: Updated" >> ../../mirror-index.md
            echo "" >> ../../mirror-index.md

            updated=$((updated+1))

            cd -

          done < mirror-list.txt

          echo "---" >> mirror-index.md
          echo "" >> mirror-index.md
          echo "Updated: $updated" >> mirror-index.md
          echo "Skipped: $skipped" >> mirror-index.md
          echo "Failed: $failed" >> mirror-index.md
