<!DOCTYPE html>
<html><head><meta charset='UTF-8'><title>Mirror Dashboard</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f8;padding:30px}
.dark{background:#1e1e1e;color:#ddd}
button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;background:#007bff;color:white}
.dark button{background:#444}
table{border-collapse:collapse;width:100%;margin-top:20px;background:white}
.dark table{background:#2a2a2a}
th,td{padding:10px;text-align:left}
th{background:#111;color:white}
tr:nth-child(even){background:#f2f2f2}
.dark tr:nth-child(even){background:#333}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.updated-dot{background:#28a745}
.skipped-dot{background:#6c757d}
.failed-dot{background:#dc3545}
a{text-decoration:none;color:#007bff}
.dark a{color:#4da3ff}
</style></head><body>
<h1>Mirror Dashboard</h1>
<button onclick="document.body.classList.toggle('dark')">Toggle Dark Mode</button>
<p id='stats'></p>
<table id='mirrorTable'>
<tr><th>Repository</th><th>Upstream SHA</th><th>Previous SHA</th><th>Status</th></tr>
<tr>
<td><a href='https://github.com/cmliu/edgetunnel' target='_blank'>cmliu/edgetunnel</a></td>
<td>58db7b5</td>
<td>none</td>
<td><span class='status-dot updated-dot'></span>Updated</td>
</tr>
</table>
<script>
const rows=Array.from(document.querySelectorAll('#mirrorTable tr')).slice(1);
rows.sort((a,b)=>b.cells[3].innerText.localeCompare(a.cells[3].innerText));
rows.forEach(r=>document.querySelector('#mirrorTable').appendChild(r));
document.getElementById('stats').innerText=
'Last Run: Sun Feb 15 18:40:38 UTC 2026 | Updated: 1 | Skipped: 0 | Failed: 0';
</script>
</body></html>
