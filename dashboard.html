<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Mirror Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #eee;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
    }

    .repo {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .links a {
      display: inline-block;
      margin: 6px 6px 0 0;
      padding: 6px 10px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, #36d1dc, #5b86e5);
    }

    .links a.beta {
      background: linear-gradient(135deg, #ff9966, #ff5e62);
    }

    .time {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.75;
    }

    footer {
      text-align: center;
      padding: 18px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>📦 GitHub Mirror Dashboard</header>

  <div class="container">
    "$CARDS"
  </div>

  <footer>
    Auto generated by GitHub Actions · Last update: "$BUILD_TIME"
  </footer>
</body>
</html>
