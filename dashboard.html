<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta http-equiv='refresh' content='120'>
<title>Mirror Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px;}
table { border-collapse: collapse; width:100%; background:white;}
th, td { border:1px solid #ddd; padding:8px; }
th { background:#222; color:white;}
.updated { color:green; font-weight:bold;}
.skipped { color:gray;}
input { padding:6px; width:250px; margin-bottom:10px; }
</style>
</head>
<body>

<h1>Mirror Dashboard</h1>
<p>Last Run: Fri Feb 13 14:36:03 UTC 2026</p>
<p>Updated: 0 | Skipped: 1 | Failed: 0</p>

<input type="text" id="searchBox" placeholder="Search repository...">

<table id="mirrorTable">
<tr>
<th>Repository</th>
<th>Latest Tag</th>
<th>Published</th>
<th>Upstream SHA</th>
<th>Previous SHA</th>
<th>Status</th>
</tr>

  <tr>
    <td>cmliu/edgetunnel</td>
    <td>none</td>
    <td>none</td>
    <td>ce7ef9fd60dfd33f8b9bcd7f63fb692e65775a16</td>
    <td>ce7ef9fd60dfd33f8b9bcd7f63fb692e65775a16</td>
    <td class='skipped'>Skipped</td>
  </tr>
</table>

<canvas id="chart" width="400" height="120"></canvas>

<script>
new Chart(document.getElementById('chart'), {
          type: 'bar',
          data: {
              labels: ['Updated','Skipped','Failed'],
              datasets: [{
                   label: 'Last Run',
                   data: [0,1,0]
              }]
          }
});

// 🔎 搜索功能
document.getElementById('searchBox').addEventListener('keyup', function() {
  const filter = this.value.toLowerCase();
  const rows = document.querySelectorAll('#mirrorTable tr');

  rows.forEach((row, index) => {
    if (index === 0) return;
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(filter) ? '' : 'none';
  });
});
</script>

</body>
</html>
