<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Mirror Dashboard</title>
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: #0f172a;
  color: #e5e7eb;
  padding: 30px;
}
h1 {
  margin-bottom: 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.card {
  background: #020617;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 10px 20px rgba(0,0,0,.4);
  transition: transform .2s;
}
.card:hover {
  transform: translateY(-4px);
}
.card h2 {
  font-size: 18px;
  margin-bottom: 10px;
}
a {
  color: #38bdf8;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<h1>📊 Mirror Dashboard</h1>
<div class="grid">

  <div class='card'>
    <h2>edgetunnel</h2>
    <p>
      <a href='diff-edgetunnel-main.html' target='_blank'>Main Diff</a> |
      <a href='diff-edgetunnel-beta2.0.html' target='_blank'>Beta2.0 Diff</a>
    </p>
  </div>
</div>
</body>
</html>
