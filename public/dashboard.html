<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>Mirror Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px;}
table { border-collapse: collapse; width:100%; background:white;}
th, td { border:1px solid #ddd; padding:8px; }
th { background:#222; color:white;}
.updated { color:green; font-weight:bold;}
.skipped { color:gray;}
.failed { color:red; font-weight:bold;}
</style>
</head>
<body>
<h1>Mirror Dashboard</h1>
<p>Last Run: Fri Feb 13 13:22:50 UTC 2026</p>
<p>Updated: 1 | Skipped: 0 | Failed: 0</p>

<table>
<tr>
<th>Repository</th>
<th>Main</th>
<th>Beta2.0</th>
<th>Latest Release</th>
<th>Upstream SHA</th>
<th>Previous SHA</th>
<th>Status</th>
</tr>

  <tr>
    <td>cmliu/edgetunnel</td>
    <td>main	HEAD</td>
    <td>ec8795bc1ea453b0c14fcb21b8eefdc801b25c40</td>
    <td>none</td>
    <td>ce7ef9fd60dfd33f8b9bcd7f63fb692e65775a16</td>
    <td>none</td>
    <td class='updated'>Updated</td>
  </tr>
</table>

<canvas id="chart" width="400" height="120"></canvas>

<script>
new Chart(document.getElementById('chart'), {
    type: 'bar',
    data: {
        labels: ['Updated','Skipped','Failed'],
        datasets: [{
            label: 'Last Run',
            data: [1,0,0]
        }]
    }
});
</script>

</body>
</html>
